[project]
name = "housing-watch"
version = "0.0.0"
description = "Watch SSSB listings and alert when a room is winnable with my queue days."
requires-python = ">=3.14"
dependencies = [
    "cryptography>=44",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
